name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, lint, and test
        run: npm run check

      - name: Update versions.json
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            versions[manifest.version] = manifest.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
          "

      - name: Commit versions.json update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.json
          git commit -m 'Update versions.json for release' || true
          # Tag checkouts are detached; push the update back onto main
          # explicitly so a non-fast-forward rejection is impossible.
          git push origin HEAD:main

      - name: Attach build provenance
        # Artifact attestation is only supported on public repositories.
        # It activates automatically once the repo is made public.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            versions.json

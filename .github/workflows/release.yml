name: Release

on:
  push:
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          test "$(node -p "require('./manifest.json').version")" = "${{ github.ref_name }}" \
            || { echo "Tag ${{ github.ref_name }} does not match manifest.json version"; exit 1; }

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, lint, and test
        run: npm run check

      - name: Add release entry to versions.json
        # Write the new mapping into the working tree only; it becomes the
        # release asset below. The commit to main happens after publishing.
        run: |
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            versions[manifest.version] = manifest.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
          "

      - name: Package plugin folder
        # One-zip manual install: extract and copy the omniscient folder
        # straight into <vault>/.obsidian/plugins/.
        run: |
          mkdir -p omniscient
          cp main.js manifest.json styles.css omniscient/
          zip -r omniscient-${{ github.ref_name }}.zip omniscient

      - name: Attach build provenance
        # Artifact attestation is only supported on public repositories.
        # It activates automatically once the repo is made public.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        # Assets are packaged from the tag checkout above. The versions.json
        # update on main happens afterwards so it can never change what the
        # release ships.
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
            omniscient-${{ github.ref_name }}.zip

      - name: Commit versions.json update on main
        # The tag checkout is detached and may sit behind main, so update
        # versions.json on a branch based on origin/main and fast-forward
        # main with it. A missing change is a no-op commit and a no-op push.
        run: |
          git fetch origin main
          git checkout -B release-update origin/main
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            versions[manifest.version] = manifest.minAppVersion;
            fs.writeFileSync('versions.json', JSON.stringify(versions, null, 2) + '\n');
          "
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.json
          git commit -m 'Update versions.json for release' || true
          git push origin release-update:main
